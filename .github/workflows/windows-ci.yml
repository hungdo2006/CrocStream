name: CrocStream Windows CI

'on':
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify the pinned upstream snapshot
        shell: pwsh
        run: |
          $tree = git rev-parse HEAD:croc
          if ($LASTEXITCODE -ne 0 -or $tree -ne '0e401898d47eaef76e62263483943e3aa789ad3a') {
            throw 'The tracked croc snapshot differs from the approved tree.'
          }
          $changes = git status --porcelain -- croc/
          if ($LASTEXITCODE -ne 0 -or $changes) { throw 'The croc working tree is dirty.' }

      - name: Configure npm and capture settings
        shell: pwsh
        run: |
          $userConfig = Join-Path $env:RUNNER_TEMP 'crocstream-user.npmrc'
          $globalConfig = Join-Path $env:RUNNER_TEMP 'crocstream-global.npmrc'
          Set-Content -LiteralPath $userConfig -Value ''
          Set-Content -LiteralPath $globalConfig -Value ''
          @(
            "NPM_CONFIG_USERCONFIG=$userConfig"
            "NPM_CONFIG_GLOBALCONFIG=$globalConfig"
            'NPM_CONFIG_REGISTRY=https://registry.npmjs.org/'
            'NPM_CONFIG_INCLUDE=dev'
            'CROCSTREAM_CAPTURE_CONSENT=0'
          ) >> $env:GITHUB_ENV

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Set up the verified npm version
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'crocstream-npm'
          npm.cmd install --prefix $prefix --ignore-scripts --no-audit --no-fund --save-exact npm@12.2.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = Join-Path $prefix 'node_modules\.bin'
          $version = & (Join-Path $bin 'npm.cmd') --version
          if ($LASTEXITCODE -ne 0 -or $version -ne '12.2.1') { throw 'Unexpected npm version.' }
          $bin >> $env:GITHUB_PATH

      - name: Cache Go modules and build objects
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ${{ runner.temp }}/crocstream-tools/gomodcache
            ${{ runner.temp }}/crocstream-tools/gocache
          key: ${{ runner.os }}-${{ runner.arch }}-crocstream-go1.27.4-${{ hashFiles('app/go.sum', 'app/g0/poc/go.sum', 'app/g0/buildprobe/go.sum') }}

      - name: Set up Go and Wails
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'crocstream-tools'
          .\app\g0\Install-Toolchain.ps1 -ToolRoot $tools -Component Go
          .\app\g0\Install-Toolchain.ps1 -ToolRoot $tools -Component Wails
          gcc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test and build on Windows
        shell: pwsh
        env:
          CGO_ENABLED: '1'
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'crocstream-tools'
          $log = Join-Path $env:RUNNER_TEMP 'crocstream-verify.log'
          powershell.exe -NoProfile -File .\scripts\verify.ps1 -ToolRoot $tools -Race 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changes = git status --porcelain -- croc/
          if ($LASTEXITCODE -ne 0 -or $changes) { throw 'The croc working tree changed during verification.' }

      - name: Audit every npm dependency
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'crocstream-npm-audit.json'
          npm.cmd --prefix app/frontend audit --package-lock-only --ignore-scripts --include=dev --audit-level=info --json > $report
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $report
          exit $code

      - name: Keep verification logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: crocstream-windows-checks
          path: |
            ${{ runner.temp }}/crocstream-verify.log
            ${{ runner.temp }}/crocstream-npm-audit.json
          retention-days: 7

      - name: Keep the unsigned test build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: crocstream-windows-amd64-unsigned
          path: app/bin/crocstream.exe
          if-no-files-found: error
          retention-days: 7
